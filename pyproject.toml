[project]
name = "advanced-rag"
version = "0.1.0"
description = "Advanced RAG pipeline with hierarchical chunking, hybrid search (BM25 + vector), cross-encoder reranking, and RAGAS evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.82.0",
    "fastembed>=0.8.0",
    "langchain-aws>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.2.22",
    "langchain-huggingface>=1.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.12",
    "langchain-text-splitters>=1.1.1",
    "langfuse>=4.2.0",
    "langgraph>=1.1.4",
    "more-itertools>=11.0.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ragas>=0.4.3",
    "sentence-transformers>=5.3.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
qdrant = ["langchain-qdrant>=0.2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25"]
demo = ["streamlit>=1.40"]
serve = ["fastapi>=0.115", "uvicorn>=0.34"]
ui = ["chainlit>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
