services:
  rag_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        UV_SYNC_EXTRAS: ${RAG_API_UV_SYNC_EXTRAS:---extra api}
        API_ENABLE_CPU_RERANK: ${RAG_API_ENABLE_CPU_RERANK:-true}
        TORCH_CPU_INDEX_URL: ${RAG_API_TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: api
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=core-db
      - QDRANT_URL=http://qdrant:6333
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-advanced-rag-api}
    healthcheck:
      # Use Python's built-in urllib so we don't need to install curl
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s # Gives Uvicorn time to boot and load your models
    depends_on:
      qdrant: { condition: service_started }

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect-server
    restart: always
    ports:
      - "${PREFECT_UI_PORT:-4200}:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@core-db:5432/${PERFECT_DB}
      PREFECT_API_URL: http://localhost:4200/api
    command: prefect server start --host 0.0.0.0 --port 4200
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      core-db: { condition: service_healthy }

  ingestion-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        UV_SYNC_EXTRAS: ${INGESTION_WORKER_UV_SYNC_EXTRAS:---extra ingestion --extra doc-processing}
    container_name: ingestion-worker
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: core-db
      QDRANT_URL: http://qdrant:6333
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_INGESTION_WORK_POOL: ${PREFECT_INGESTION_WORK_POOL:-ingestion-pool}
      PREFECT_WORKER_LIMIT: ${PREFECT_WORKER_LIMIT:-2}
    volumes:
      - ./data/source_documents:/app/data/source_documents:ro
    depends_on:
      core-db: { condition: service_healthy }
      qdrant: { condition: service_started }
      prefect-server: { condition: service_healthy }

  web_ui:
    image: ghcr.io/open-webui/open-webui:main # Or your custom UI build
    container_name: web
    ports:
      - "${RAG_WEB_UI_PORT:-3000}:8080"
    environment:
      # You just point the UI to your RAG API as if it were OpenAI!
      - OPENAI_API_BASE_URL=http://rag_api:8000/v1
      - OPENAI_API_KEY=dummy_key
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl --silent --fail http://localhost:8080/health | grep -q '"status":true' &&
          curl --silent --fail http://localhost:8080/api/models | grep -q '"id"' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    volumes:
      - open-webui-data:/app/backend/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    volumes:
      - qdrant_data:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: always
    container_name: phoenix
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

  core-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: always
    container_name: db
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PERFECT_DB: ${PERFECT_DB}
      RAG_DB: ${POSTGRES_RAG_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
  postgres_data:
  open-webui-data:
  phoenix_data:

networks:
  default:
    name: rag_core_network
