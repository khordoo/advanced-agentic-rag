x-api-build: &api-build
  context: .
  dockerfile: docker/Dockerfile.api
  args:
    UV_SYNC_EXTRAS: ${RAG_API_UV_SYNC_EXTRAS:---extra api --extra ui}

services:
  model-warmer:
    image: advanced-rag-api:local
    build: *api-build
    container_name: model-warmer
    env_file:
      - .env
    environment:
      - FASTEMBED_CACHE_DIR=/app/.cache/fastembed
      - RERANK_MODEL_NAME=BAAI/bge-reranker-base
    volumes:
      - fastembed-cache:/app/.cache/fastembed
    command: >
      .venv/bin/python -c "import os; from fastembed import TextEmbedding, SparseTextEmbedding; from fastembed.rerank.cross_encoder import TextCrossEncoder; cache_dir=os.environ['FASTEMBED_CACHE_DIR']; dense=os.environ.get('EMBEDDING_MODEL_NAME', 'BAAI/bge-small-en-v1.5'); sparse=os.environ.get('QDRANT_SPARSE_MODEL', 'Qdrant/bm42-all-minilm-l6-v2-attentions'); reranker=os.environ.get('RERANK_MODEL_NAME', 'BAAI/bge-reranker-base'); print(f'Downloading embedding model: {dense}'); TextEmbedding(model_name=dense, cache_dir=cache_dir); print(f'Downloading sparse model: {sparse}'); SparseTextEmbedding(model_name=sparse, cache_dir=cache_dir); print(f'Downloading reranker: {reranker}'); TextCrossEncoder(model_name=reranker, cache_dir=cache_dir); print('Models downloaded successfully.');"

  rag_api:
    image: advanced-rag-api:local
    build: *api-build
    container_name: api
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-core-db}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OPEN_AI_COMPATIBLE_BASE_URL=${OPEN_AI_COMPATIBLE_BASE_URL:-http://host.docker.internal:1234/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-advanced-rag-api}
    volumes:
      - ./app:/app/app:ro
      - ./db:/app/db:ro
      - ./evaluation:/app/evaluation:ro
      - ./orchestration:/app/orchestration:ro
      - ./rag_core:/app/rag_core:ro
      - ./tests:/app/tests:ro
      - fastembed-cache:/app/.cache/fastembed
    healthcheck:
      # Use Python's built-in urllib so we don't need to install curl
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s # Gives Uvicorn time to boot and load your models
    depends_on:
      qdrant: { condition: service_started }
      model-warmer: { condition: service_completed_successfully }

  rag_cli:
    image: advanced-rag-api:local
    build: *api-build
    profiles: [ "tools" ]
    container_name: cli
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-core-db}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OPEN_AI_COMPATIBLE_BASE_URL=${OPEN_AI_COMPATIBLE_BASE_URL:-http://host.docker.internal:1234/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-advanced-rag-cli}
    volumes:
      - fastembed-cache:/app/.cache/fastembed
    command: [ ".venv/bin/python", "-m", "rag_core.cli" ]
    depends_on:
      rag_api: { condition: service_healthy }

  rag_ui:
    image: advanced-rag-api:local
    build: *api-build
    profiles: [ "tools" ]
    container_name: local-ui
    ports:
      - "${RAG_LOCAL_UI_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-core-db}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OPEN_AI_COMPATIBLE_BASE_URL=${OPEN_AI_COMPATIBLE_BASE_URL:-http://host.docker.internal:1234/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://phoenix:6006/v1/traces}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-advanced-rag-ui}
      - UI_APP=${UI_APP:-fastapi}
    volumes:
      - ./examples:/app/examples
      - fastembed-cache:/app/.cache/fastembed
    entrypoint: [ "/entrypoint-ui.sh" ]
    depends_on:
      rag_api: { condition: service_healthy }

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: prefect-server
    restart: always
    ports:
      - "${PREFECT_UI_PORT:-4200}:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@core-db:5432/${PERFECT_DB}
      PREFECT_API_URL: http://localhost:4200/api
    command: prefect server start --host 0.0.0.0 --port 4200
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      core-db: { condition: service_healthy }

  rag-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        UV_SYNC_EXTRAS: ${PREFECT_WORKER_UV_SYNC_EXTRAS:---extra ingestion --extra doc-processing --extra eval}
    container_name: rag-worker
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-core-db}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-rag-work-pool}
      PREFECT_LOGGING_EXTRA_LOGGERS: ${PREFECT_LOGGING_EXTRA_LOGGERS:-rag_core}
      PREFECT_WORKER_LIMIT: ${PREFECT_WORKER_LIMIT:-2}
    volumes:
      - ./app:/app/app:ro
      - ./db:/app/db:ro
      - ./evaluation:/app/evaluation:ro
      - ./orchestration:/app/orchestration:ro
      - ./rag_core:/app/rag_core:ro
      - ./tests:/app/tests:ro
      - ./data/source_documents:/app/data/source_documents:ro
      - ./evaluation/dataset:/app/evaluation/dataset:ro
      - hf-cache-volume:/app/.cache/huggingface
      - fastembed-cache:/app/.cache/fastembed
    depends_on:
      core-db: { condition: service_healthy }
      qdrant: { condition: service_started }
      prefect-server: { condition: service_healthy }
      model-warmer: { condition: service_completed_successfully }

  web_ui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: web
    ports:
      - "${RAG_WEB_UI_PORT:-3000}:8080"
    environment:
      # You just point the UI to your RAG API as if it were OpenAI!
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-http://rag_api:8000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy_key}
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl --silent --fail http://localhost:8080/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      rag_api: { condition: service_healthy }

  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    volumes:
      - qdrant_data:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:version-16.0.0
    restart: always
    container_name: phoenix
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

  core-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: always
    container_name: db
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PERFECT_DB: ${PERFECT_DB}
      RAG_DB: ${POSTGRES_RAG_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
  postgres_data:
  open-webui-data:
  phoenix_data:
  hf-cache-volume:
  fastembed-cache:

networks:
  default:
    name: rag_core_network
